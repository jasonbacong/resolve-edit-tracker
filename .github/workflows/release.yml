name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Version from tag
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build & zip
        run: ./make_app.sh --zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/ResolveEditTracker-${APP_VERSION}.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "
          **Requires DaVinci Resolve Studio** (external scripting is Studio-only).

          The app is not notarized, so on first launch macOS will block it. Either
          right-click the app → **Open**, or run:
          \`\`\`
          xattr -dr com.apple.quarantine \"/Applications/Resolve Edit Tracker.app\"
          \`\`\`
          "
